<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>QUIZCANO</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

<!-- ========================================================= -->
<!-- SECTION 01 -->
<!-- QUIZCANO HEADER -->
<!-- ========================================================= -->

<header class="header">

<div class="container">

<div class="logo">

<img src="images/logo.png" alt="Quizcano Logo">

<div>

<h2>QUIZCANO</h2>

<p>PLAY QUIZ • WIN AMAZING GIFTS</p>

</div>

</div>

<nav class="navbar">

<ul>

<li><a class="active" href="#">Home</a></li>

<li><a href="#">Quizzes</a></li>

<li><a href="#">Winners</a></li>

<li><a href="#">How It Works</a></li>

<li><a href="#">Leaderboard</a></li>

</ul>

</nav>

<div class="header-right">

<button class="search-btn">

<i class="fa-solid fa-magnifying-glass"></i>

</button>

<a href="#" class="login-btn">

Login / Sign Up

</a>

<div class="menu-btn">

<i class="fa-solid fa-bars"></i>

</div>

</div>

</div>

</header>

<!-- ========================================================= -->
<!-- HERO -->
<!-- ========================================================= -->

<section class="hero">

<div class="container hero-grid">

<div class="hero-content">

<h1>

PLAY QUIZ

<span>WIN AMAZING GIFTS!</span>

</h1>

<p>

Test your knowledge, have fun and stand a chance to win incredible prizes you love.

</p>

<div class="stats">

<div class="stat">

<i class="fa-solid fa-gift"></i>

<div>

<h2>50</h2>

<span>Amazing Gifts</span>

</div>

</div>

<div class="stat">

<i class="fa-solid fa-trophy"></i>

<div>

<h2>10,248</h2>

<span>Winners</span>

</div>

</div>

<div class="stat">

<i class="fa-solid fa-users"></i>

<div>

<h2>1M+</h2>

<span>Happy Players</span>

</div>

</div>

</div>

</div>

<div class="hero-image">

<img src="images/hero/prizes.png" alt="Prizes">

</div>

</div>

</section>

<!-- End Section 01 -->

<script src="js/app.js"></script>

</body>

</html>
